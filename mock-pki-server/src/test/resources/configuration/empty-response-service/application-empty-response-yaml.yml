    ####################################################################################
    # Explicit response header handling.                                               #
    # HTTP 200 OK status code.                                                         #
    ####################################################################################

    # Explicitly configured NoOpResponseHeadersConfigurerFactory
    # using literal style block scalar to format the factory argument string as indentation based block style YAML
    - method: GET
      path: respond-200-explicitly-no-headers-1
      factory:
        type: ee.ristoseene.pki.mock.server.service.generic.factory.EmptyResponseServiceControllerFactory
        argument: |
          httpStatus: 200
          httpHeadersConfigurerFactory:
            type: ee.ristoseene.pki.mock.server.http.header.factory.NoOpResponseHeadersConfigurerFactory
            argument: this should be ignored

    # Explicitly configured NoOpResponseHeadersConfigurerFactory
    # using compact inline YAML-formatted factory argument string
    - method: GET
      path: respond-200-explicitly-no-headers-2
      factory:
        type: ee.ristoseene.pki.mock.server.service.generic.factory.EmptyResponseServiceControllerFactory
        argument: '{httpStatus: 200, httpHeadersConfigurerFactory: {type: ee.ristoseene.pki.mock.server.http.header.factory.NoOpResponseHeadersConfigurerFactory}}'

    # Explicitly configured NoOpResponseHeadersConfigurerFactory
    # using compact inline JSON-formatted factory argument string
    - method: GET
      path: respond-200-explicitly-no-headers-3
      factory:
        type: ee.ristoseene.pki.mock.server.service.generic.factory.EmptyResponseServiceControllerFactory
        argument: '{"httpStatus": 200, "httpHeadersConfigurerFactory": {"type": "ee.ristoseene.pki.mock.server.http.header.factory.NoOpResponseHeadersConfigurerFactory"}}'

